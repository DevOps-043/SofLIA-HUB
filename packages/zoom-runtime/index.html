<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sesión de SofLIA</title><style>
html,body,#meeting{margin:0;width:100%;min-height:100%;background:#10161c;color:#fff;font:14px system-ui}#status{padding:16px}[hidden]{display:none!important}
.video-session{box-sizing:border-box;padding:12px}.video-session nav{display:flex;gap:8px;flex-wrap:wrap}.video-session button{padding:10px 14px;border:1px solid #486174;border-radius:8px;background:#163748;color:#fff;cursor:pointer}.video-session button:focus-visible{outline:2px solid #42ded0}.video-session button:disabled{opacity:.5;cursor:default}
.video-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.video-tile{position:relative;min-height:150px;aspect-ratio:16/9;background:#19272f;border-radius:8px;overflow:hidden}.video-tile video-player{width:100%;height:100%}.video-tile span{position:absolute;bottom:4px;left:6px;background:#10161ccc;padding:4px}.video-share{display:block;height:55vh}.video-share video-player{width:100%;height:100%}.share-preview{width:100%;max-height:45vh;object-fit:contain}.video-participants{max-height:85px;overflow:auto;color:#bbcbd4}
.participant-presentation{height:100vh;min-height:0;display:flex;flex-direction:column;padding:0;position:relative;overflow:hidden}.participant-presentation .video-grid{flex:1;min-height:0;padding:8px}.participant-presentation .video-share{flex:1;min-height:0;height:auto}.participant-presentation.has-remote-share .video-grid{position:absolute;bottom:12px;right:12px;width:24%;min-width:100px;max-height:30%;display:block;padding:0;overflow:hidden}.participant-presentation.has-remote-share .video-tile{min-height:0}.participant-presentation.has-remote-share .video-tile:not(:first-child){display:none}
</style></head><body><div id="status" role="status">Preparando la sesión…</div><div id="meeting"></div><script type="module" src="./runtime.ts"></script></body></html>
