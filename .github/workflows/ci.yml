name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-readers:
    uses: ./.github/workflows/python-readers.yml

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HARNESS_BASE_REF: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configurar Python para contratos sin dependencias
        run: node scripts/quality/prepare-test-python.mjs --github-actions

      - name: Verify pull request
        run: npm run verify:pr

      - name: Conservar informe de cobertura
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cobertura-ci
          path: |
            coverage/coverage-summary.json
            coverage/lcov.info
          if-no-files-found: warn
          retention-days: 7
