name: Instalador de aula síncrona QA

on:
  push:
    branches: [codex/complete-synchronous-system]
    paths:
      - .github/workflows/live-qa.yml
      - scripts/quality/build-live-qa.mjs
      - package.json

permissions:
  contents: read

concurrency:
  group: aula-sincrona-qa-20261107
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run runtime:stable
      - run: npm run python:setup
      - name: Construir y verificar el instalador de QA
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SOFIA_SUPABASE_URL: ${{ secrets.VITE_SOFIA_SUPABASE_URL }}
          VITE_SOFIA_SUPABASE_ANON_KEY: ${{ secrets.VITE_SOFIA_SUPABASE_ANON_KEY }}
        run: npm run installer:live-qa
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aula-sincrona-windows-qa
          if-no-files-found: error
          compression-level: 0
          path: |
            release/0.9.9-sync.20261107/Soflia-Hub-Windows-0.9.9-sync.20261107-Setup.exe
            release/0.9.9-sync.20261107/testing-package.json
            release/0.9.9-sync.20261107/SHA256SUMS.txt

  publish:
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: aula-sincrona-windows-qa
          path: paquete
      - name: Publicar la prerelease de QA
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        shell: bash
        working-directory: paquete
        run: |
          sha256sum --check SHA256SUMS.txt
          repo=DevOps-043/PulseHub-SofLIA-releases
          tag=v0.9.9-sync.20261107
          gh release create "$tag" Soflia-Hub-Windows-0.9.9-sync.20261107-Setup.exe testing-package.json SHA256SUMS.txt \
            --repo "$repo" --draft --prerelease --latest=false --title "Aula síncrona QA 0.9.9-sync.20261107" \
            --notes "Candidato Windows x64 sin firma para equipos de QA. Learning de pruebas: https://codex-complete-synchronous-system--soflia-learning.netlify.app. Consulta el manifiesto y el SHA-256 adjuntos."
          gh release edit "$tag" --repo "$repo" --draft=false --prerelease --latest=false
