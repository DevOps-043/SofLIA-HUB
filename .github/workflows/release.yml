name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Solo un release a la vez
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ─── Paso 1: Verificar si ya existe el release ───
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      exists: ${{ steps.check_release.outputs.exists }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Validate releases token
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Falta configurar el secret RELEASES_TOKEN en Settings > Secrets and variables > Actions."
            exit 1
          fi

          if ! TOKEN_USER=$(gh api user --jq '.login' 2>/dev/null); then
            echo "::error::RELEASES_TOKEN es invalido, expiro o fue revocado. Genera un PAT nuevo y actualiza el secret."
            exit 1
          fi
          echo "RELEASES_TOKEN autenticado como ${TOKEN_USER}."

          if ! CAN_PUSH=$(gh api repos/DevOps-043/PulseHub-SofLIA-releases --jq '.permissions.push // false'); then
            echo "::error::RELEASES_TOKEN es valido, pero no puede acceder a DevOps-043/PulseHub-SofLIA-releases."
            exit 1
          fi

          if [ "$CAN_PUSH" != "true" ]; then
            echo "::error::RELEASES_TOKEN no tiene permisos de escritura sobre DevOps-043/PulseHub-SofLIA-releases."
            exit 1
          fi

      - name: Check if release already exists
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" --repo DevOps-043/PulseHub-SofLIA-releases > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

  # ─── Paso 2: Build Windows ───
  build-windows:
    needs: check
    if: needs.check.outputs.exists == 'false'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create .env file
        run: |
          echo "VITE_GEMINI_API_KEY=${{ secrets.VITE_GEMINI_API_KEY }}" >> .env
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env
          echo "VITE_SOFIA_SUPABASE_URL=${{ secrets.VITE_SOFIA_SUPABASE_URL }}" >> .env
          echo "VITE_SOFIA_SUPABASE_ANON_KEY=${{ secrets.VITE_SOFIA_SUPABASE_ANON_KEY }}" >> .env
          echo "VITE_IRIS_SUPABASE_URL=${{ secrets.VITE_IRIS_SUPABASE_URL }}" >> .env
          echo "VITE_IRIS_SUPABASE_ANON_KEY=${{ secrets.VITE_IRIS_SUPABASE_ANON_KEY }}" >> .env
          echo "VITE_GOOGLE_OAUTH_CLIENT_ID=${{ secrets.VITE_GOOGLE_OAUTH_CLIENT_ID }}" >> .env
          echo "VITE_GOOGLE_OAUTH_CLIENT_SECRET=${{ secrets.VITE_GOOGLE_OAUTH_CLIENT_SECRET }}" >> .env
          echo "VITE_GAMMA_API_KEY=${{ secrets.VITE_GAMMA_API_KEY }}" >> .env
          echo "VITE_GOOGLE_CLOUD_TTS_API_KEY=${{ secrets.VITE_GOOGLE_CLOUD_TTS_API_KEY }}" >> .env
          echo "VITE_CHAT_TTS_PROVIDER=${{ secrets.VITE_CHAT_TTS_PROVIDER }}" >> .env
          echo "VITE_GOOGLE_CLOUD_TTS_VOICE=${{ secrets.VITE_GOOGLE_CLOUD_TTS_VOICE }}" >> .env
          echo "VITE_GOOGLE_CLOUD_TTS_LANGUAGE=${{ secrets.VITE_GOOGLE_CLOUD_TTS_LANGUAGE }}" >> .env

      - name: Build Electron app (Windows)
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: npm run build

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            release/${{ needs.check.outputs.version }}/Pulse-Hub-Windows-${{ needs.check.outputs.version }}-Setup.exe
            release/${{ needs.check.outputs.version }}/Pulse-Hub-Windows-${{ needs.check.outputs.version }}-Setup.exe.blockmap
            release/${{ needs.check.outputs.version }}/latest.yml

  # ─── Paso 2b: Build Mac ───
  build-mac:
    needs: check
    if: needs.check.outputs.exists == 'false'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create .env file
        run: |
          echo "VITE_GEMINI_API_KEY=${{ secrets.VITE_GEMINI_API_KEY }}" >> .env
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env
          echo "VITE_SOFIA_SUPABASE_URL=${{ secrets.VITE_SOFIA_SUPABASE_URL }}" >> .env
          echo "VITE_SOFIA_SUPABASE_ANON_KEY=${{ secrets.VITE_SOFIA_SUPABASE_ANON_KEY }}" >> .env
          echo "VITE_IRIS_SUPABASE_URL=${{ secrets.VITE_IRIS_SUPABASE_URL }}" >> .env
          echo "VITE_IRIS_SUPABASE_ANON_KEY=${{ secrets.VITE_IRIS_SUPABASE_ANON_KEY }}" >> .env
          echo "VITE_GOOGLE_OAUTH_CLIENT_ID=${{ secrets.VITE_GOOGLE_OAUTH_CLIENT_ID }}" >> .env
          echo "VITE_GOOGLE_OAUTH_CLIENT_SECRET=${{ secrets.VITE_GOOGLE_OAUTH_CLIENT_SECRET }}" >> .env
          echo "VITE_GAMMA_API_KEY=${{ secrets.VITE_GAMMA_API_KEY }}" >> .env
          echo "VITE_GOOGLE_CLOUD_TTS_API_KEY=${{ secrets.VITE_GOOGLE_CLOUD_TTS_API_KEY }}" >> .env
          echo "VITE_CHAT_TTS_PROVIDER=${{ secrets.VITE_CHAT_TTS_PROVIDER }}" >> .env
          echo "VITE_GOOGLE_CLOUD_TTS_VOICE=${{ secrets.VITE_GOOGLE_CLOUD_TTS_VOICE }}" >> .env
          echo "VITE_GOOGLE_CLOUD_TTS_LANGUAGE=${{ secrets.VITE_GOOGLE_CLOUD_TTS_LANGUAGE }}" >> .env

      - name: Build Electron app (Mac)
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          # tsc pica en ~2.4 GB en este proyecto. El runner de macOS tiene 7 GB
          # de RAM (Windows y Linux tienen 16), asi que Node deriva un heap por
          # defecto de ~2 GB y aborta con "Reached heap limit" (exit 134) antes
          # de terminar el chequeo. 4 GB dan margen sin dejar que un proceso
          # desbocado se coma toda la RAM del runner.
          NODE_OPTIONS: --max-old-space-size=4096
        # build:mac es la cadena canonica (typecheck de ambos tsconfig, vite,
        # bitmaps, runtime de Python y electron-builder). Antes se replicaba a
        # mano y se perdia el chequeo de tsconfig.node.json.
        run: npm run build:mac

      - name: Upload Mac artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-artifacts
          path: |
            release/${{ needs.check.outputs.version }}/Pulse-Hub-Mac-${{ needs.check.outputs.version }}-Installer.dmg
            release/${{ needs.check.outputs.version }}/latest-mac.yml

  # ─── Paso 2c: Build Linux ───
  build-linux:
    needs: check
    if: needs.check.outputs.exists == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Linux smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libportaudio2

      - name: Install dependencies
        run: npm ci

      - name: Create .env file
        run: |
          echo "VITE_GEMINI_API_KEY=${{ secrets.VITE_GEMINI_API_KEY }}" >> .env
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env
          echo "VITE_SOFIA_SUPABASE_URL=${{ secrets.VITE_SOFIA_SUPABASE_URL }}" >> .env
          echo "VITE_SOFIA_SUPABASE_ANON_KEY=${{ secrets.VITE_SOFIA_SUPABASE_ANON_KEY }}" >> .env
          echo "VITE_IRIS_SUPABASE_URL=${{ secrets.VITE_IRIS_SUPABASE_URL }}" >> .env
          echo "VITE_IRIS_SUPABASE_ANON_KEY=${{ secrets.VITE_IRIS_SUPABASE_ANON_KEY }}" >> .env
          echo "VITE_GOOGLE_OAUTH_CLIENT_ID=${{ secrets.VITE_GOOGLE_OAUTH_CLIENT_ID }}" >> .env
          echo "VITE_GOOGLE_OAUTH_CLIENT_SECRET=${{ secrets.VITE_GOOGLE_OAUTH_CLIENT_SECRET }}" >> .env
          echo "VITE_GAMMA_API_KEY=${{ secrets.VITE_GAMMA_API_KEY }}" >> .env
          echo "VITE_GOOGLE_CLOUD_TTS_API_KEY=${{ secrets.VITE_GOOGLE_CLOUD_TTS_API_KEY }}" >> .env
          echo "VITE_CHAT_TTS_PROVIDER=${{ secrets.VITE_CHAT_TTS_PROVIDER }}" >> .env
          echo "VITE_GOOGLE_CLOUD_TTS_VOICE=${{ secrets.VITE_GOOGLE_CLOUD_TTS_VOICE }}" >> .env
          echo "VITE_GOOGLE_CLOUD_TTS_LANGUAGE=${{ secrets.VITE_GOOGLE_CLOUD_TTS_LANGUAGE }}" >> .env

      - name: TypeScript check
        run: npx tsc --noEmit --incremental false

      - name: Build renderer and main process
        run: npx vite build

      - name: Build Electron app (Linux AppImage)
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: node scripts/generate-bitmaps.js && node scripts/setup-python-runtime.js && npx electron-builder --linux AppImage deb --x64

      - name: Smoke test Linux AppImage startup
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          APPIMAGE="release/${{ needs.check.outputs.version }}/Pulse-Hub-Linux-${{ needs.check.outputs.version }}-x64.AppImage"
          chmod +x "$APPIMAGE"
          set +e
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" timeout 20s "$APPIMAGE" --no-sandbox
          EXIT_CODE=$?
          set -e
          if [ "$EXIT_CODE" -ne 0 ] && [ "$EXIT_CODE" -ne 124 ]; then
            echo "Linux AppImage smoke test failed with exit code $EXIT_CODE"
            exit "$EXIT_CODE"
          fi

      - name: Verify Linux artifacts
        run: |
          test -f "release/${{ needs.check.outputs.version }}/Pulse-Hub-Linux-${{ needs.check.outputs.version }}-x64.AppImage"
          test -f "release/${{ needs.check.outputs.version }}/Pulse-Hub-Linux-${{ needs.check.outputs.version }}-x64.deb"
          test -f "release/${{ needs.check.outputs.version }}/latest-linux.yml"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            release/${{ needs.check.outputs.version }}/Pulse-Hub-Linux-${{ needs.check.outputs.version }}-x64.AppImage
            release/${{ needs.check.outputs.version }}/Pulse-Hub-Linux-${{ needs.check.outputs.version }}-x64.deb
            release/${{ needs.check.outputs.version }}/latest-linux.yml

  # ─── Paso 3: Crear Release con todos los artefactos ───
  release:
    needs: [check, build-windows, build-mac, build-linux]
    if: needs.check.outputs.exists == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (for CHANGELOG)
        uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: artifacts/

      - name: Download Mac artifacts
        uses: actions/download-artifact@v4
        with:
          name: mac-artifacts
          path: artifacts/

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: artifacts/

      - name: Create release in DevOps-043/PulseHub-SofLIA-releases
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          VERSION="${{ needs.check.outputs.version }}"

          # Extraer novedades del CHANGELOG para esta versión
          NOTES=$(sed -n "/## \[${VERSION}\]/,/## \[/p" CHANGELOG.md | head -n -1)
          if [ -z "$NOTES" ]; then
            NOTES="Pulse Hub v${VERSION}"
          fi

          # Listar archivos disponibles
          echo "=== Artifacts ==="
          find artifacts/ -type f
          echo "================="

          # Crear release y subir todos los archivos
          gh release create "v${VERSION}" \
            --repo DevOps-043/PulseHub-SofLIA-releases \
            --title "Pulse Hub v${VERSION}" \
            --notes "$NOTES" \
            artifacts/*
