name: Candidato nativo del lector Python

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/python-reader-native.yml
      - scripts/quality/build-reader-wheel.py
      - python/tools_sidecar/**
      - test/python-native-build.lock

permissions:
  contents: read

jobs:
  macos-intel:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - name: Obtener fuentes sin conservar credenciales
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /python/tools_sidecar/
            /python/bootstrap.lock
            /test/python-native-build.lock
            /scripts/quality/build-reader-wheel.py
      - name: Configurar el Python fijado
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.12.11
          architecture: x64
      - name: Configurar Rust fijado
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Construir y verificar el candidato sin publicarlo
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -I -B -X utf8 scripts/quality/build-reader-wheel.py --output "$RUNNER_TEMP/reader-candidate"
      - name: Conservar candidato y recibo para revisión
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-reader-macos-intel-candidate
          path: ${{ runner.temp }}/reader-candidate/
          retention-days: 14
          if-no-files-found: error
