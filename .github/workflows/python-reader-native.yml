name: Candidato nativo del lector Python

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/python-reader-native.yml
      - scripts/quality/build-reader-wheel.py
      - scripts/quality/prepare-test-python.mjs
      - scripts/python-runtime-support.cjs
      - scripts/python-runtime-download.mjs
      - python/tools_sidecar/**
      - python/bootstrap.lock
      - test/python-native-build.lock

permissions:
  contents: read

jobs:
  macos-intel:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - name: Obtener fuentes sin conservar credenciales
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /python/tools_sidecar/
            /python/bootstrap.lock
            /test/python-native-build.lock
            /scripts/quality/build-reader-wheel.py
            /scripts/quality/prepare-test-python.mjs
            /scripts/python-runtime-support.cjs
            /scripts/python-runtime-download.mjs
      - name: Configurar Node para preparar el intérprete
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Preparar el mismo Python fijado del producto
        run: node scripts/quality/prepare-test-python.mjs --github-actions
      - name: Configurar Rust fijado
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Construir y verificar el candidato sin publicarlo
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: '"$SOFLIA_TEST_PYTHON" -I -B -X utf8 scripts/quality/build-reader-wheel.py --output "$RUNNER_TEMP/reader-candidate"'
      - name: Conservar candidato y recibo para revisión
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-reader-macos-intel-candidate
          path: ${{ runner.temp }}/reader-candidate/
          retention-days: 14
          if-no-files-found: error
