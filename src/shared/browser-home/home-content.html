<div class="ambience" aria-hidden="true"></div>
<main>
  <div class="brand-art">
    <div class="halo" aria-hidden="true"></div>
    <img class="logo" src="__HOME_LOGO__" width="1537" height="1023" alt="Logo de SofLIA" draggable="false">
  </div>
  <h1>¿Qué vamos a <span>descubrir?</span></h1>
  <p class="intro">Tus ideas tienen un lugar para empezar.</p>
  <form action="https://www.google.com/search" method="get" role="search" class="search">
    <label class="visually-hidden" for="query">Buscar en la web</label>
    <input id="query" name="q" type="search" placeholder="Busca algo que te inspire" maxlength="32768" autocomplete="off" required>
    <button type="submit" aria-label="Buscar en la web" title="Buscar">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5" stroke-linecap="round"/></svg>
    </button>
  </form>
  <p class="keyboard-hint">O escribe una dirección arriba <span aria-hidden="true">·</span> <kbd>Ctrl</kbd> + <kbd>L</kbd></p>
</main>
